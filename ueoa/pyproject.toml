[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ueoa"
version = "0.1.0"
description = "UEOA Enterprise Task Execution Hub - orchestration core"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "truststore>=0.10",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
]
# Entra ID tokens for agents with auth scheme `entra` (e.g. Microsoft Foundry agents over A2A)
azure = ["azure-identity>=1.24"]
# PostgreSQL persistence (UEOA_STORE_URL); empty URL = in-memory
db = ["sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "alembic>=1.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/ueoa", "src/ueoa_sdk"]
artifacts = ["src/ueoa/api/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["live: hits real external services (LLM gateway); run with -m live"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["AgentFramework"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
